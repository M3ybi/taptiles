services:
  - type: web
    name: taptiles-web
    runtime: java
    plan: free
    buildCommand: mvn -DskipTests package -Pprod
    startCommand: java -jar target/gamestudio_robert_fedorco.war --spring.profiles.active=prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
