spring.profiles.active=prod
server.port=${PORT:8080}

#https://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres/gamestudio_robert_fedorco}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:robert_fedorco}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# https://github.com/spring-projects/spring-boot/issues/12007
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
